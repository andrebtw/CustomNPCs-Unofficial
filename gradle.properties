org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Mappings: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.11
parchment_mappings_version=2025.12.20

# Environment: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.11
minecraft_version_range=[1.21.11]
neo_version=21.11.48

# Mod properties
# mod_id and the base package (noppes.npcs) are kept from 1.12.2 so the
# scripting API (noppes.npcs.api.*) stays source-compatible for user scripts.
mod_id=customnpcs
mod_name=Custom NPCs
mod_license=CC BY-NC 3.0
mod_version=0.1.0-alpha
mod_group_id=noppes.npcs
mod_authors=Noppes, Goodbird, BetaZavr
mod_description=Custom NPCs (Unofficial) ported to NeoForge for Minecraft 1.21.11.
